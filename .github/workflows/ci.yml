name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      # The versions production runs: the burpee jail's erlang-runtime28 and
      # elixir-devel.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          elixir-version: "1.20.4"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-otp28.5-elixir1.20.4-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp28.5-elixir1.20.4-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test --warnings-as-errors
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: assets
      - run: npm test
        working-directory: assets

  # serai update on the NUC deploys what this job marks: a commit on master
  # whose tests passed. Pushed without force, so deploy only moves forward.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push origin HEAD:refs/heads/deploy
